[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-benchmarks"
version = "0"
requires-python = ">=3.11"

[project.scripts]
osrs-benchmarks = "osrs_benchmarks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osrs_benchmarks = ["suites/*.json", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
