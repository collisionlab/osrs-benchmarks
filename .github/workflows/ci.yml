name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: collisionlab
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the package and run the tests
        run: nix flake check -L

  # infra pins this repo as a flake input: ops applies the ClickHouse schema from it and the
  # benchmark runner module runs its package. Each push to main opens a pin PR there, which
  # infra merges itself once its checks pass.
  pin:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: collisionlab
          repositories: infra
      - name: Pin this commit in infra
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: scripts/pin-infra
